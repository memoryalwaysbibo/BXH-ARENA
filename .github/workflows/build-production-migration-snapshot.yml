name: Build Production Migration Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Beta source as read-only input
        run: git clone --depth 1 https://github.com/memoryalwaysbibo/BXH_ARENA_BETA.git /tmp/beta

      - name: Create isolated migration branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B migration/beta-snapshot

          # Keep .git intact. Clear tracked working files safely instead of deleting
          # the working tree around the repository metadata.
          git rm -rf . ':!.github/workflows/build-production-migration-snapshot.yml' || true
          mkdir -p .github/workflows

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='CNAME' \
            /tmp/beta/ ./

          test -d .git
          test ! -f CNAME
          test -f index.html
          test -f firestore.rules

          cat > PRODUCTION_MIGRATION_LOCK.md <<'EOF'
          # Production migration lock
          This branch is a code snapshot only. Do not deploy it yet.
          Beta CNAME and Beta GitHub Actions were intentionally excluded.
          Firebase web config must be changed from bxh-arena-beta to the verified bxh-arena web-app config before release.
          Tester/Beta account policy must be removed before release.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Beta snapshot with production deployment lock"
          git push --force origin migration/beta-snapshot
