name: Audit Production Migration Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout productionized snapshot
        uses: actions/checkout@v4
        with:
          ref: migration/beta-snapshot

      - name: Verify migration isolation and report residual Beta/test references
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f firestore.rules
          test ! -f CNAME

          echo "== Active runtime target audit =="
          # Historical release notes, archived patches, and migration tooling may mention Beta.
          # Only executable Firebase config is a deployment blocker here.
          if grep -nE 'apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId' index.html | grep -E 'bxh-arena-beta|beta\\.bxh\\.com\\.tw'; then
            echo "FAIL: active Firebase config still targets Beta." >&2
            exit 1
          fi

          echo "== Firebase production target =="
          grep -nE 'projectId[[:space:]]*:[[:space:]]*["'\''"]bxh-arena["'\''"]' index.html
          grep -nE 'authDomain[[:space:]]*:[[:space:]]*["'\''"]bxh-arena\.firebaseapp\.com["'\''"]' index.html

          echo "== Tester/test-account references for manual classification =="
          grep -RIn --exclude-dir=.git -E 'tester|isTestAccount|testMode|測試|封測' . || true

          echo "== Function/API endpoint references =="
          grep -RIn --exclude-dir=.git -E 'cloudfunctions\.net|httpsCallable|connectFunctionsEmulator|getFunctions\(' . || true

          echo "== Firebase service references =="
          grep -RIn --exclude-dir=.git -E 'getDatabase\(|firebase/database|databaseURL|storageBucket|getStorage\(|firebase/storage' . || true

          echo "AUDIT_PASS: active Firebase config targets Production; historical Beta references are reported separately."
