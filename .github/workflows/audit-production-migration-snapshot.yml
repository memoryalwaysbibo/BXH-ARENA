name: Audit Production Migration Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout productionized snapshot
        uses: actions/checkout@v4
        with:
          ref: migration/beta-snapshot

      - name: Verify production migration safety
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f firestore.rules
          test ! -f CNAME

          echo "== Firebase Production config =="
          grep -nE 'projectId[[:space:]]*:[[:space:]]*["'\''"]bxh-arena["'\''"]' index.html
          grep -nE 'authDomain[[:space:]]*:[[:space:]]*["'\''"]bxh-arena\.firebaseapp\.com["'\''"]' index.html

          echo "== Ensure no Beta values exist in Firebase config property lines =="
          if grep -nE '^[[:space:]]*(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)[[:space:]]*:' index.html | grep -E 'bxh-arena-beta|beta\.bxh\.com\.tw'; then
            echo "FAIL: Firebase config property still targets Beta." >&2
            exit 1
          fi

          echo "== Report Beta/test runtime guards for manual review =="
          grep -nE 'bxh-arena-beta|tester|isTestAccount|testMode|測試|封測' index.html firestore.rules || true

          echo "== Report Function/API references =="
          grep -nE 'cloudfunctions\.net|httpsCallable|connectFunctionsEmulator|getFunctions\(' index.html || true

          echo "== Report RTDB/Storage code references =="
          grep -nE 'getDatabase\(|firebase/database|databaseURL|getStorage\(|firebase/storage' index.html || true

          echo "AUDIT_PASS"
